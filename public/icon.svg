<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3e1e10" />
      <stop offset="50%" stop-color="#241007" />
      <stop offset="100%" stop-color="#160803" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.9"/>
  
  <!-- Subtle Traditional Motif Circles (Kawung Pattern) -->
  <g opacity="0.18" stroke="#f59e0b" stroke-width="4" fill="none">
    <circle cx="256" cy="120" r="64" />
    <circle cx="256" cy="392" r="64" />
    <circle cx="120" cy="256" r="64" />
    <circle cx="392" cy="256" r="64" />
    <circle cx="256" cy="256" r="90" stroke-dasharray="6 6" />
  </g>

  <!-- Center Shield Badge -->
  <path d="M256 90 L380 145 V255 C380 335 320 395 256 425 C192 395 132 335 132 255 V145 Z" fill="url(#innerGlow)" stroke="url(#goldGrad)" stroke-width="10" stroke-linejoin="round"/>

  <!-- House / RT Emblem Icon in Shield -->
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200 240 L256 190 L312 240" stroke="#fef08a" stroke-width="14" />
    <path d="M214 235 V305 H298 V235" stroke="#ffffff" stroke-width="12" />
    <path d="M242 305 V265 H270 V305" stroke="#fde047" stroke-width="10" />
  </g>

  <!-- RT Monogram Tag -->
  <rect x="176" y="335" width="160" height="52" rx="26" fill="url(#goldGrad)" />
  <text x="256" y="371" font-family="sans-serif" font-weight="900" font-size="30" fill="#1c0b05" text-anchor="middle" letter-spacing="2">RT 02</text>

  <!-- Top Title -->
  <text x="256" y="140" font-family="serif" font-weight="bold" font-size="24" fill="#fef08a" text-anchor="middle" letter-spacing="3">GASEM RAYA</text>
</svg>