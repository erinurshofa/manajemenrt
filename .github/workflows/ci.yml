name: RT Gasem CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔍 TypeScript Type Check
        run: npm run lint

      - name: 🧪 Automated Unit Tests (Vitest)
        run: npm test

      - name: 🏗️ Production Build & PWA Generation
        run: npm run build
